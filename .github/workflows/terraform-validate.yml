name: Terraform fmt & validate

on:
  pull_request:
    paths:
      - '**/*.tf'
  push:
    branches: [ main ]
    paths:
      - '**/*.tf'

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: ./examples/simple
        run: terraform init -input=false

      - name: Terraform fmt check
        working-directory: ./examples/simple
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ./examples/simple
        run: terraform validate || true

      - name: Generate terraform-docs for module (optional)
        run: |
          # Generate inputs/outputs markdown for the module and save as INPUTS_OUTPUTS.md
          docker run --rm -v "${{ github.workspace }}":/workspace quay.io/terraform-docs/terraform-docs:latest markdown /workspace/modules/proxmox-bgp > /workspace/modules/proxmox-bgp/INPUTS_OUTPUTS.md || true

      - name: Print notice
        run: |
          echo "Note: validate may fail without provider credentials; this CI ensures syntax/format correctness. Provide secrets in repo settings to run full plan." 
