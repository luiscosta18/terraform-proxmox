name: Create release on push to main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine release tag
        id: tag
        run: |
          # Create a deterministic tag using date + short SHA
          DATE=$(date -u +"%Y.%m.%d")
          SHA=$(git rev-parse --short=8 HEAD)
          echo "TAG=v${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Package module
        run: |
          git archive \
            --format=zip \
            --output="terraform-proxmox-${{ steps.tag.outputs.TAG }}.zip" \
            HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: terraform-proxmox-${{ steps.tag.outputs.TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
