name: Create release from conventional commits

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record previous release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create semantic release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          release-type: simple

      - name: Package and upload release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$TAG" ] || [ "$TAG" = "$PREVIOUS_TAG" ]; then
            echo "No new release was created."
            exit 0
          fi

          ARCHIVE="terraform-proxmox-${TAG}.zip"
          git archive --format=zip --output="$ARCHIVE" "$TAG"
          gh release upload "$TAG" "$ARCHIVE" --clobber
